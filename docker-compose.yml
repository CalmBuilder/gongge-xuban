name: gongge-xuban

services:
  mysql:
    image: mysql:8.4.10
    container_name: gongge-xuban-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
      - "${MYSQL_BIND_ADDRESS:?MYSQL_BIND_ADDRESS is required}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-/home/zhengqi/data_gongge_xuban/mysql/mysql_data}
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 1m
