[project]
name = "gongge-xuban-backend"
version = "0.1.0"
description = "FastAPI backend for the Gongge Xuban enterprise digital-expert platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0,<2.0.0",
  # cryptography 49 的 macOS wheel 会动态链接其内置 OpenSSL；PyInstaller 可能误选
  # Python 自带的同名旧 libssl.3.dylib，使 Intel .app 启动时报缺失符号。
  "cryptography>=42.0.0,<49.0.0",
  "fastapi>=0.139.2,<1.0.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pypdf>=4.2.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2,<7.0.0",
  "pymysql>=1.1.0,<2.0.0",
  "requests>=2.32.0",
  "sqlmodel>=0.0.21",
  "sqlalchemy>=2.0.0,<2.1.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0,<3.0.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]
packaging = [
  "pyinstaller>=6.6.0",
  "certifi>=2024.2.2",
  "pillow>=10.4.0,<12.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["desktop_launcher", "single_port_app"]

[tool.setuptools.packages.find]
include = ["app*", "mock_servers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mysql: requires the local MySQL 8.4 integration service",
  "slack_live: requires an isolated Slack workspace, bot token, team id, and channel id",
]
